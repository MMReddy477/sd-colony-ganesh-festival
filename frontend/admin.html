<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Ganesh Utsav</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></head><body class="admin-body"><div id="loginView" class="login-shell"><div class="login-panel"><span class="brand-mark">ॐ</span><p class="eyebrow">Committee workspace</p><h1>Welcome back.</h1><p class="muted">Sign in to keep the celebration moving.</p><form id="loginForm" class="mt-4"><label>Username<input class="form-control" name="username" required autocomplete="username"></label><label>Password<input class="form-control" type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-saffron w-100" type="submit">Enter dashboard ↗</button><div id="loginError" class="alert alert-danger mt-3 d-none"></div></form><a class="back-link" href="/">← Back to public portal</a></div></div><div id="dashboardView" class="d-none"><nav class="admin-nav"><div class="container-fluid"><a class="navbar-brand" href="/"><span class="brand-mark">ॐ</span> Ganesh Utsav <small>ADMIN</small></a><button id="logout" class="btn btn-outline-light btn-sm">Log out</button></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-end mb-4"><div><p class="eyebrow">Control room</p><h1>Good morning, admin.</h1></div><span id="lastUpdated" class="muted"></span></div><div class="row g-3 mb-5" id="adminStats"></div><div class="admin-grid"><section class="admin-card"><div class="card-head"><div><p class="eyebrow">Finance</p><h2>Donations</h2></div><div class="btn-group"><button class="btn btn-sm btn-dark-red" data-report="donations/pdf">PDF</button><button class="btn btn-sm btn-outline-dark" data-report="donations/xlsx">Excel</button></div></div><form id="donationForm" class="row g-2"><input name="donorName" class="form-control col" placeholder="Donor name" required><input name="amount" type="number" min="0" class="form-control col" placeholder="Amount" required><input name="mobile" class="form-control col" placeholder="Mobile"><select name="paymentMode" class="form-select col"><option>Cash</option><option>UPI</option><option>Bank transfer</option></select><button class="btn btn-saffron col-auto">Add donor</button></form><div id="donationAdminList" class="admin-list"></div></section><section class="admin-card"><div class="card-head"><div><p class="eyebrow">Outgoings</p><h2>Expenditure</h2></div><button class="btn btn-sm btn-outline-dark" data-report="expenses/xlsx">Export Excel</button></div><form id="expenseForm" class="row g-2"><input name="name" class="form-control" placeholder="Expense name" required><input name="amount" type="number" min="0" class="form-control" placeholder="Amount" required><button class="btn btn-dark-red col-auto">Add expense</button></form><div id="expenseAdminList" class="admin-list"></div></section><section class="admin-card"><div class="card-head"><div><p class="eyebrow">People</p><h2>Committee</h2></div></div><form id="memberForm" class="row g-2"><input name="name" class="form-control" placeholder="Name" required><input name="designation" class="form-control" placeholder="Designation"><input name="mobile" class="form-control" placeholder="Mobile"><button class="btn btn-saffron col-auto">Add member</button></form><div id="memberAdminList" class="admin-list"></div></section><section class="admin-card"><div class="card-head"><div><p class="eyebrow">Programming</p><h2>Events</h2></div></div><form id="eventForm" class="row g-2"><input name="name" class="form-control" placeholder="Event name" required><input name="date" type="date" class="form-control"><input name="time" class="form-control" placeholder="Time"><input name="venue" class="form-control" placeholder="Venue"><button class="btn btn-dark-red col-auto">Add event</button></form><div id="eventAdminList" class="admin-list"></div></section><section class="admin-card"><div class="card-head"><div><p class="eyebrow">Memories</p><h2>Gallery</h2></div><a class="btn btn-sm btn-outline-dark" href="/api/gallery/zip">Download ZIP</a></div><form id="galleryForm" class="row g-2" enctype="multipart/form-data"><input name="title" class="form-control" placeholder="Album title"><input name="images" type="file" accept="image/*" multiple class="form-control"><button class="btn btn-saffron col-auto">Upload images</button></form><div id="galleryAdminList" class="admin-list"></div></section></div></main></div><script src="/admin.js"></script></body></html>
