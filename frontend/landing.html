<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Suryodaya Colony Public Page</title>
    <style>
      :root {
        color-scheme: light;
        --maroon: #7a1f1f;
        --deep-maroon: #43151b;
        --gold: #d6a62c;
        --cream: #fff8ed;
        --ink: #241d1b;
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, var(--deep-maroon), var(--maroon));
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }

      .landing-shell {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr);
        gap: clamp(1.5rem, 5vw, 5rem);
        align-items: center;
        width: min(1120px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(1.25rem, 5vw, 4rem);
      }

      .landing-images {
        display: grid;
        gap: 1rem;
      }

      .landing-images figure {
        position: relative;
        margin: 0;
        overflow: hidden;
        border: 5px solid var(--cream);
        border-radius: 16px;
        background: var(--cream);
        box-shadow: 0 18px 40px #241d1b55;
      }

      .landing-images img {
        display: block;
        width: 100%;
        height: clamp(190px, 32vw, 330px);
        object-fit: cover;
      }

      .landing-images figcaption {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: .65rem .8rem;
        background: #241d1bcc;
        color: var(--cream);
        font-size: .9rem;
      }

      .landing-panel {
        padding: clamp(1.25rem, 4vw, 2.5rem);
        border: 1px solid #f4d47799;
        border-radius: 16px;
        background: var(--cream);
        box-shadow: 0 18px 40px #241d1b55;
      }

      .landing-panel h1 {
        margin: 0 0 .5rem;
        color: var(--maroon);
        font-size: clamp(1.7rem, 4vw, 2.8rem);
        line-height: 1.05;
      }

      .landing-panel p { margin: 0 0 1.5rem; color: #6d5148; }
      .landing-panel label { display: block; color: var(--maroon); font-weight: 700; }
      .landing-panel select,
      .landing-panel .landing-button {
        display: block;
        width: 100%;
        min-height: 46px;
        margin-top: .55rem;
        padding: .7rem .85rem;
        border: 1px solid var(--gold);
        border-radius: 7px;
        font: inherit;
      }

      .landing-panel select { background: #fff; color: var(--ink); }
      .landing-actions { display: grid; gap: .7rem; margin-top: 1.5rem; }
      .landing-button { cursor: pointer; text-align: center; text-decoration: none; }
      .landing-button-primary { background: var(--maroon); color: #fff; }
      .landing-button-secondary { background: #fff; color: var(--maroon); }
      .landing-button:focus-visible,
      .landing-panel select:focus-visible { outline: 3px solid #f4b94299; outline-offset: 2px; }

      @media (max-width: 768px) {
        .landing-shell { grid-template-columns: 1fr; align-content: center; }
        .landing-images img { height: min(56vw, 260px); }
      }
    </style>
  </head>
  <body>
    <main class="landing-shell">
      <section class="landing-images" aria-label="Suryodaya Colony images">
        <figure>
          <img src="/GaneshIdol_detail.jpeg" alt="Ganesh idol decorated for the Utsav" />
          <figcaption>Ganesh Utsav</figcaption>
        </figure>
        <figure>
          <img src="/sd-team-image.jpeg" alt="SD Team at a community celebration" />
          <figcaption>Suryodaya Colony SD Team</figcaption>
        </figure>
      </section>

      <section class="landing-panel" aria-labelledby="landingTitle">
        <h1 id="landingTitle">Suryodaya Colony</h1>
        <p>Choose a public page or sign in to continue.</p>
        <label for="pageSelector">Public Pages</label>
        <select id="pageSelector">
          <option value="">-- Choose Option --</option>
          <option value="ganesh">Ganesh Utsav Public Page</option>
          <option value="family">Family Gathering Party Public Page</option>
        </select>
        <div class="landing-actions">
          <a class="landing-button landing-button-primary" href="/admin.html">Admin Login</a>
          <a class="landing-button landing-button-secondary" href="/family.html">Family Party Login</a>
        </div>
      </section>
    </main>
    <script>
      document.getElementById('pageSelector').addEventListener('change', event => {
        if (event.target.value === 'ganesh') window.location.href = '/ganesh-public.html';
        if (event.target.value === 'family') window.location.href = '/family.html';
      });
    </script>
  </body>
</html>
